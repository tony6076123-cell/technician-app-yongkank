name: Keep Alive

# 🦞 讓 Render 免費版白天不要休眠：每 10 分鐘 ping 一次首頁。
#    Render 免費方案閒置約 15 分鐘就會睡著，海哥/技師打開時要等 30-60 秒喚醒、常顯示「載入失敗」。
#    這個排程在台灣時間約 06:00-22:00（UTC 22:00-13:59）之間定時喚醒，讓大家白天打開都是秒開。
#    夜間放它去睡，省 Render 每月 750 小時額度（估白天約 480 小時/月，遠低於上限）。
#    GitHub Actions 對 public repo 免費不限量；排程偶爾會延遲幾分鐘，但已足夠大幅減少休眠。

on:
  schedule:
    - cron: '*/10 22-23,0-13 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping to keep server awake
        run: curl -s -m 30 https://yongkang-tech-app.onrender.com/ -o /dev/null || true
