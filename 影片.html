<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>系統說明影片</title>
<style>
:root{--ink:#1d1d1f;--sub:#3d4756;--muted:#86868b;--line:#e5e5ea;--bg:#f2f3f5;--card:#fff;--accent:#e11d2a;--dark:#111316}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding-bottom:40px}
header{background:var(--dark);color:#fff;padding:16px 18px}
.back{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:999px;
  padding:6px 15px;font-size:13px;font-family:inherit}
h1{margin:10px 0 2px;font-size:21px;font-weight:900}
header .sub{font-size:12.5px;color:#aeb4bd}
main{padding:14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{margin:0 0 2px;font-size:17px;font-weight:900}
.cap{font-size:12px;color:var(--muted);margin-bottom:10px}
video,img.shot{width:100%;border-radius:10px;display:block;background:#000}
img.shot{background:transparent}
ul{margin:10px 0 0;padding-left:18px}
li{font-size:14px;line-height:1.75;color:var(--sub)}
b.hl{color:var(--accent)}
.note{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:10px}
</style>
</head>
<body>
<header>
  <button class="back" onclick="location.href='/'">‹ 回主選單</button>
  <h1>系統說明影片</h1>
  <div class="sub">報表改版做了什麼、現場要配合什麼</div>
</header>
<main>
  <div class="card">
    <h2>業績報表改版說明</h2>
    <div class="cap">約 42 秒・含 App 實際畫面與三張報表卡</div>
    <video src="/media/reform.mp4" poster="/media/reform.png" controls playsinline preload="metadata"></video>
    <ul>
      <li>廠長每天匯出的報表 <b class="hl">12 張 → 4 張</b>（205 技師／接待／延保＋1G0 明細）</li>
      <li>上月同期、去年同期不用再匯，系統自己留紀錄比較</li>
      <li>每日業績報表由管理部轉寄（一封含兩廠），廠長不用處理</li>
      <li>新增延長保固件數、接待零件明細、三組台數與單車產值</li>
      <li>週報卡每週一、月報卡每月 1 號、年報卡 12/31 自動產出</li>
    </ul>
  </div>

  <div class="card">
    <h2>一頁說明圖</h2>
    <div class="cap">可長按存檔，轉給廠區同仁</div>
    <img class="shot" src="/media/reform.png" alt="業績報表改版說明">
    <div class="note">影片與說明圖都放在系統內，更新時這裡會跟著換，不用另外傳檔。</div>
  </div>
</main>
</body>
</html>
